name: Live fund and stock pilot acceptance

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Inclusive SEC filing start (YYYY-MM-DD)"
        type: string
        required: true
        default: "2026-04-01"
      until:
        description: "Inclusive SEC filing end (YYYY-MM-DD)"
        type: string
        required: true
        default: "2026-11-03"
      trace_run:
        description: "Export workflow spans (no model calls)?"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: sec-live-pilot-acceptance
  cancel-in-progress: false

jobs:
  live-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      OPENAI_API_KEY: ${{ inputs.trace_run && secrets.OPENAI_API_KEY || '' }}
      ENABLE_OPENAI_TRACING: ${{ inputs.trace_run && '1' || '0' }}
      OPENAI_AGENTS_TRACE_INCLUDE_SENSITIVE_DATA: 'false'
      USE_SEMANTIC_DETECTORS: '0'
      ENABLE_DAILY_AI_RESEARCH: '0'
      START_DATE: ${{ inputs.since }}
      END_DATE: ${{ inputs.until }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline testing and opt-in trace instrumentation
        run: python -m pip install -e '.[dev,tracing]'
      - name: Run offline tests before SEC requests
        run: |
          python -m pytest
          python -m compileall -q app.py src/filing_intel
      - name: Validate live discovery, baselines, evidence and replay
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::Missing SEC_USER_AGENT Actions secret."
            exit 1
          fi
          if [ "$ENABLE_OPENAI_TRACING" = "1" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Trace export requested without OPENAI_API_KEY."
            exit 1
          fi
          python examples/live_dual_track_smoke.py \
            --stock-cik 320193 --stock-name "Apple Inc." \
            --fund-cik 36405 --fund-name "Vanguard 500 Index Fund" \
            --series-id S000002839 --class-id C000092055 \
            --since "$START_DATE" --to "$END_DATE" \
            --db ".filing-intel/live-acceptance.sqlite3" \
            --report "artifacts/live-pilot-acceptance.json"
      - name: Upload public SEC acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-pilot-acceptance
          path: artifacts/live-pilot-acceptance.json
          if-no-files-found: warn
          retention-days: 14
