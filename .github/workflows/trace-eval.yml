name: Manual live SEC tracing and evaluation

on:
  workflow_dispatch:
    inputs:
      run_ai:
        description: "Allow ONE bounded OpenAI research investigation using existing credits?"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: sec-trace-eval
  cancel-in-progress: false

jobs:
  pinned-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tests, OpenAI client and optional tracer
        run: python -m pip install -e '.[dev,ai,tracing]'
      - name: Run offline regression tests first
        run: python -m pytest
      - name: Pinned real SEC filings and exact quote verification
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          OPENAI_API_KEY: ${{ inputs.run_ai && secrets.OPENAI_API_KEY || '' }}
          ENABLE_OPENAI_TRACING: ${{ inputs.run_ai && '1' || '0' }}
          OPENAI_AGENTS_TRACE_INCLUDE_SENSITIVE_DATA: 'false'
          USE_SEMANTIC_DETECTORS: '0'
          RESEARCH_MODEL: gpt-5-mini
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::Add SEC_USER_AGENT secret with a real name and contact email."
            exit 1
          fi
          if [ "${{ inputs.run_ai }}" = "true" ]; then
            if [ -z "$OPENAI_API_KEY" ]; then
              echo "::error::OPENAI_API_KEY secret is missing."
              exit 1
            fi
            python -m filing_intel.intel_trace_eval --ai
          else
            python -m filing_intel.intel_trace_eval
          fi
      - name: Upload public-source evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-trace-evaluation
          path: artifacts/sec-trace-eval.json
          if-no-files-found: warn
          retention-days: 14
