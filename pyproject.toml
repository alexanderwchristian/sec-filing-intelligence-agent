[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-filing-intelligence-agent"
version = "0.1.0"
description = "Evidence-first SEC 10-K risk factor change detection and evaluation prototype."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Alex Christian"}]
dependencies = ["requests>=2.31,<3", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
ui = ["streamlit>=1.38,<2"]
ai = ["openai>=1.60,<3"]
dev = ["pytest>=8,<10"]

[project.scripts]
filing-intel = "filing_intel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
